{% extends "base.html" %}
{% block titulo %}Editar especialidad — PsicoApp{% endblock %}

{% block contenido %}
<a href="{% url 'cuentas:gestionar_especialidades' %}" class="text-muted small">
<a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">← Volver</a>
</a>

<h2 class="mt-2 mb-4 fw-bold">Editar especialidad</h2>

{% if messages %}
  {% for msg in messages %}
    <div class="alert alert-{{ msg.tags|default:'info' }} py-2 small">{{ msg }}</div>
  {% endfor %}
{% endif %}

<div class="card border-0 shadow-sm" style="max-width:480px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="nombre" class="form-label fw-semibold">Nombre de la especialidad</label>
        <input type="text" id="nombre" name="nombre"
               class="form-control"
               value="{{ especialidad.nombre }}"
               maxlength="100" required>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger">Guardar cambios</button>
        <a href="{% url 'cuentas:gestionar_especialidades' %}" class="btn btn-outline-secondary">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
